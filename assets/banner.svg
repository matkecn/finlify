    <rect x="3.5" y="3.5" width="121" height="121" rx="26.5" fill="none" stroke="url(#b-stroke)" stroke-opacity="0.30" stroke-width="1.6"/>
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.4">
